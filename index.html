<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Singing Synth</title>
    <style>
        body { font-family: sans-serif; background: black; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 400px; }
        h1 { font-size: 1.5rem; color: #333; margin-top: 0; }
        label { display: block; margin-bottom: 5px; font-size: 0.9rem; color: #666; }
        textarea { width: 100%; height: 80px; margin-bottom: 1rem; border: 1px solid #ddd; border-radius: 4px; padding: 8px; box-sizing: border-box; }
        .controls { display: flex; gap: 10px; margin-bottom: 1rem; }
        button { flex: 1; padding: 10px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; transition: opacity 0.2s; }
        .play-btn { background: #4caf50; color: white; }
        .stop-btn { background: #f44336; color: white; }
        button:hover { opacity: 0.8; }
        .status { font-size: 0.8rem; color: #888; text-align: center; }
    </style>
</head>
<body>

<div class="card">
    <h1>Singing Synth</h1>
    
    <label>歌詞（ひらがなで入力してください）</label>
    <textarea id="lyrics">かえるのうたが きこえてくるよ</textarea>
    
    <label>メロディ設定</label>
    <div class="controls">
        <button class="play-btn" onclick="playSong()">再生</button>
        <button class="stop-btn" onclick="stopSong()">停止</button>
    </div>

    <div class="status" id="status">Ready</div>
</div>

<script>
    let audioCtx = null;
    let isPlaying = false;

    // 音階（周波数）の定義
    const notes = {
        'C4': 261.63, 'D4': 293.66, 'E4': 329.63, 'F4': 349.23,
        'G4': 392.00, 'A4': 440.00, 'B4': 493.88, 'C5': 523.25
    };

    // 簡易的なメロディデータ (かえるのうた)
    const melody = [
        { note: 'C4', length: 0.5 }, { note: 'D4', length: 0.5 }, { note: 'E4', length: 0.5 }, { note: 'F4', length: 0.5 },
        { note: 'E4', length: 0.5 }, { note: 'D4', length: 0.5 }, { note: 'C4', length: 0.5 }, { note: null, length: 0.5 }
    ];

    async function playSong() {
        if (isPlaying) return;
        isPlaying = true;
        
        // ブラウザのWeb Speech APIを使用
        const synth = window.speechSynthesis;
        const text = document.getElementById('lyrics').value.replace(/\s+/g, '');
        const status = document.getElementById('status');

        for (let i = 0; i < text.length; i++) {
            if (!isPlaying) break;

            const char = text[i];
            const noteInfo = melody[i % melody.length]; // ループで音を割り当て
            
            status.textContent = `Singing: ${char}`;

            // 1. 発話の作成
            const utter = new SpeechSynthesisUtterance(char);
            utter.lang = 'ja-JP';
            utter.rate = 1.2; // 速度
            
            // 2. 音程の調整 (Pitchは0〜2の範囲)
            // SpeechSynthesisのPitchは物理的な周波数指定が難しいため、相対値で表現
            utter.pitch = 1.0 + (i % 3) * 0.2; 

            synth.speak(utter);

            // 音の長さに合わせて待機
            await new Promise(resolve => setTimeout(resolve, 400));
        }

        status.textContent = "Finished";
        isPlaying = false;
    }

    function stopSong() {
        window.speechSynthesis.cancel();
        isPlaying = false;
        document.getElementById('status').textContent = "Stopped";
    }
</script>

</body>
</html>
