<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web UTAU-like Synth</title>
    <style>
        :root {
            --bg-color: #2b2b2b;
            --panel-color: #3c3f41;
            --accent-color: #ff4081;
            --text-color: #e0e0e0;
            --grid-line: #4a4a4a;
            --note-bg: #6ab04c;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Header / Toolbar */
        header {
            background: var(--panel-color);
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            z-index: 10;
        }

        h1 { margin: 0; font-size: 1.2rem; display: flex; align-items: center; gap: 10px; }
        .logo-box { background: var(--accent-color); color: white; padding: 2px 8px; border-radius: 4px; font-weight: bold; }

        .controls { display: flex; gap: 10px; }
        
        button {
            background: #555;
            color: white;
            border: 1px solid #666;
            padding: 5px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.2s;
        }
        button:hover { background: #666; }
        button.play-btn { background: var(--accent-color); border-color: var(--accent-color); font-weight: bold; }
        button.stop-btn { background: #d32f2f; border-color: #b71c1c; }

        input[type="number"] {
            background: #222; border: 1px solid #555; color: white; padding: 5px; width: 60px; border-radius: 4px;
        }

        /* Main Editor Area */
        .main-editor {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Note List (Tracker Style) */
        .track-list {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #222;
        }

        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; color: #888; padding-bottom: 10px; border-bottom: 2px solid #444; }
        td { padding: 5px; border-bottom: 1px solid #333; }
        
        .note-row { transition: background 0.1s; }
        .note-row.playing { background: rgba(255, 64, 129, 0.3); }
        .note-row:hover { background: #2a2a2a; }

        input.lyric-input {
            width: 100%; background: transparent; border: none; color: var(--accent-color); 
            font-size: 1.1rem; font-weight: bold; outline: none;
        }
        
        select.note-select, select.len-select {
            background: #333; color: white; border: 1px solid #444; padding: 4px; border-radius: 4px;
        }

        /* Footer */
        footer {
            background: var(--panel-color);
            padding: 5px 20px;
            font-size: 0.8rem;
            color: #888;
            text-align: right;
        }

        .add-btn {
            margin-top: 10px;
            width: 100%;
            padding: 10px;
            background: #333;
            border: 1px dashed #666;
            color: #888;
        }
        .add-btn:hover { background: #444; color: white; }

        /* Visualizer */
        #oscilloscope {
            width: 100px;
            height: 30px;
            background: #000;
            border: 1px solid #444;
        }
    </style>
</head>
<body>

<header>
    <h1><span class="logo-box">V</span> Web Synth</h1>
    <div class="controls">
        <label>BPM: <input type="number" id="bpm" value="120"></label>
        <button class="play-btn" onclick="sequencer.play()">▶ Play</button>
        <button class="stop-btn" onclick="sequencer.stop()">■ Stop</button>
    </div>
    <canvas id="oscilloscope"></canvas>
</header>

<div class="main-editor">
    <div class="track-list">
        <table>
            <thead>
                <tr>
                    <th style="width: 50px;">#</th>
                    <th>歌詞 (Lyrics)</th>
                    <th style="width: 100px;">音階 (Note)</th>
                    <th style="width: 100px;">長さ (Len)</th>
                    <th style="width: 50px;">削除</th>
                </tr>
            </thead>
            <tbody id="note-container">
                </tbody>
        </table>
        <button class="add-btn" onclick="ui.addNoteRow()">+ 音符を追加</button>
    </div>
</div>

<footer>
    Status: <span id="status-text">Ready</span> | Use Hiragana for lyrics (a, i, u, e, o formants supported)
</footer>

<script>
    /**
     * 簡易フォルマントシンセサイザーエンジン
     * Sawtooth波を母音フィルタ（Formant）に通して声を模倣します。
     */
    const AudioEngine = {
        ctx: null,
        masterGain: null,
        analyser: null,

        // 日本語母音のフォルマント周波数 (F1, F2) の近似値
        formants: {
            'a': [800, 1200],
            'i': [300, 2500],
            'u': [300, 1200],
            'e': [500, 1900],
            'o': [500, 800],
            'n': [200, 500]  // ん
        },

        init() {
            if (!this.ctx) {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                this.masterGain = this.ctx.createGain();
                this.masterGain.gain.value = 0.3; // 全体の音量
                
                this.analyser = this.ctx.createAnalyser();
                this.analyser.fftSize = 256;

                this.masterGain.connect(this.analyser);
                this.analyser.connect(this.ctx.destination);
                
                visualizer(); // ビジュアライザ開始
            }
            if (this.ctx.state === 'suspended') {
                this.ctx.resume();
            }
        },

        // ひらがなから母音を判定する簡易ロジック
        getVowel(char) {
            const map = {
                'あ': 'a', 'か': 'a', 'さ': 'a', 'た': 'a', 'な': 'a', 'は': 'a', 'ま': 'a', 'や': 'a', 'ら': 'a', 'わ': 'a',
                'い': 'i', 'き': 'i', 'し': 'i', 'ち': 'i', 'に': 'i', 'ひ': 'i', 'み': 'i', 'り': 'i',
                'う': 'u', 'く': 'u', 'す': 'u', 'つ': 'u', 'ぬ': 'u', 'ふ': 'u', 'む': 'u', 'ゆ': 'u', 'る': 'u',
                'え': 'e', 'け': 'e', 'せ': 'e', 'て': 'e', 'ね': 'e', 'へ': 'e', 'め': 'e', 'れ': 'e',
                'お': 'o', 'こ': 'o', 'そ': 'o', 'と': 'o', 'の': 'o', 'ほ': 'o', 'も': 'o', 'よ': 'o', 'ろ': 'o', 'を': 'o',
                'ん': 'n'
            };
            return map[char] || 'a'; // デフォルトは 'a'
        },

        // 音を鳴らす
        playTone(freq, char, duration, time) {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            
            // フォルマントフィルタの作成 (F1, F2)
            const vowel = this.getVowel(char);
            const freqs = this.formants[vowel];

            const f1 = this.ctx.createBiquadFilter();
            const f2 = this.ctx.createBiquadFilter();
            
            f1.type = 'bandpass';
            f1.frequency.value = freqs[0];
            f1.Q.value = 5; // 共鳴の強さ

            f2.type = 'bandpass';
            f2.frequency.value = freqs[1];
            f2.Q.value = 5;

            // 接続: Osc -> F1/F2 (Parallel) -> Gain -> Master
            // 並列接続のためにGainを分岐させる
            osc.type = 'sawtooth'; // 声帯の振動に近いノコギリ波
            osc.frequency.value = freq;

            osc.connect(f1);
            osc.connect(f2);
            
            f1.connect(gain);
            f2.connect(gain);

            gain.connect(this.masterGain);

            // エンベロープ (ADSR)
            const attack = 0.05;
            const release = 0.1;
            
            gain.gain.setValueAtTime(0, time);
            gain.gain.linearRampToValueAtTime(1.0, time + attack);
            gain.gain.setValueAtTime(1.0, time + duration - release);
            gain.gain.linearRampToValueAtTime(0, time + duration);

            osc.start(time);
            osc.stop(time + duration + 0.1);
        }
    };

    /**
     * シーケンサー
     */
    const Sequencer = {
        isPlaying: false,
        timerID: null,
        currentNoteIndex: 0,
        notes: [],

        // 音階周波数マップ
        noteFreqs: {
            'C4': 261.63, 'C#4': 277.18, 'D4': 293.66, 'D#4': 311.13, 'E4': 329.63, 'F4': 349.23, 'F#4': 369.99,
            'G4': 392.00, 'G#4': 415.30, 'A4': 440.00, 'A#4': 466.16, 'B4': 493.88,
            'C5': 523.25, 'D5': 587.33, 'E5': 659.25
        },

        play() {
            if (this.isPlaying) return;
            
            AudioEngine.init();
            this.isPlaying = true;
            this.currentNoteIndex = 0;
            
            // UIからデータを取得
            this.notes = ui.getNoteData();
            
            this.scheduleNext();
        },

        scheduleNext() {
            if (!this.isPlaying) return;
            if (this.currentNoteIndex >= this.notes.length) {
                this.stop();
                return;
            }

            const noteData = this.notes[this.currentNoteIndex];
            const bpm = parseInt(document.getElementById('bpm').value);
            const beatTime = 60 / bpm; // 1拍の秒数
            const duration = noteData.length * beatTime; // 音価 * 1拍

            // UIハイライト
            ui.highlightRow(this.currentNoteIndex);
            document.getElementById('status-text').textContent = `Singing: ${noteData.lyric}`;

            // 再生 (休符以外)
            if (noteData.note !== 'REST') {
                const freq = this.noteFreqs[noteData.note];
                if (freq) {
                    // AudioEngineは現在時刻(currentTime)を基準にスケジュールする
                    // 簡易実装のため、ここでは「即時再生」し、setTimeoutで次を待つ方式をとります
                    // (本格的なDAWではLookaheadスケジューリングを使いますが、可読性重視です)
                    AudioEngine.playTone(freq, noteData.lyric, duration, AudioEngine.ctx.currentTime);
                }
            }

            this.currentNoteIndex++;
            
            // 次の音へ
            this.timerID = setTimeout(() => {
                this.scheduleNext();
            }, duration * 1000);
        },

        stop() {
            this.isPlaying = false;
            clearTimeout(this.timerID);
            ui.clearHighlight();
            document.getElementById('status-text').textContent = "Stopped";
        }
    };

    /**
     * UI管理
     */
    const ui = {
        container: document.getElementById('note-container'),
        
        // デフォルト曲: かえるのうた
        defaultSong: [
            { l:'か', n:'C4', len:1 }, { l:'え', n:'D4', len:1 }, { l:'る', n:'E4', len:1 }, { l:'の', n:'F4', len:1 },
            { l:'う', n:'E4', len:1 }, { l:'た', n:'D4', len:1 }, { l:'が', n:'C4', len:2 },
            { l:'き', n:'E4', len:1 }, { l:'こ', n:'F4', len:1 }, { l:'え', n:'G4', len:1 }, { l:'て', n:'A4', len:1 },
            { l:'く', n:'G4', len:1 }, { l:'る', n:'F4', len:1 }, { l:'よ', n:'E4', len:2 }
        ],

        init() {
            this.defaultSong.forEach(n => this.addNoteRow(n.l, n.n, n.len));
        },

        addNoteRow(lyric = 'ら', note = 'C4', len = 1) {
            const tr = document.createElement('tr');
            tr.className = 'note-row';
            tr.innerHTML = `
                <td><span class="row-num"></span></td>
                <td><input type="text" class="lyric-input" value="${lyric}" maxlength="1"></td>
                <td>
                    <select class="note-select">
                        ${this.generateNoteOptions(note)}
                    </select>
                </td>
                <td>
                    <select class="len-select">
                        <option value="0.5" ${len===0.5?'selected':''}>0.5 (8分)</option>
                        <option value="1" ${len===1?'selected':''}>1.0 (4分)</option>
                        <option value="2" ${len===2?'selected':''}>2.0 (2分)</option>
                        <option value="4" ${len===4?'selected':''}>4.0 (全)</option>
                    </select>
                </td>
                <td><button onclick="this.closest('tr').remove(); ui.renumber();" style="background:#d32f2f; padding:2px 8px;">×</button></td>
            `;
            this.container.appendChild(tr);
            this.renumber();
        },

        generateNoteOptions(selected) {
            const notes = Object.keys(Sequencer.noteFreqs);
            notes.push('REST'); // 休符
            return notes.map(n => `<option value="${n}" ${n === selected ? 'selected' : ''}>${n}</option>`).join('');
        },

        renumber() {
            const rows = this.container.querySelectorAll('.note-row');
            rows.forEach((row, index) => {
                row.querySelector('.row-num').textContent = index + 1;
            });
        },

        getNoteData() {
            const rows = this.container.querySelectorAll('.note-row');
            const data = [];
            rows.forEach(row => {
                data.push({
                    lyric: row.querySelector('.lyric-input').value,
                    note: row.querySelector('.note-select').value,
                    length: parseFloat(row.querySelector('.len-select').value)
                });
            });
            return data;
        },

        highlightRow(index) {
            this.clearHighlight();
            const rows = this.container.querySelectorAll('.note-row');
            if (rows[index]) {
                rows[index].classList.add('playing');
                // スクロール追従
                rows[index].scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        },

        clearHighlight() {
            const playing = this.container.querySelectorAll('.playing');
            playing.forEach(el => el.classList.remove('playing'));
        }
    };

    // 簡易ビジュアライザ
    function visualizer() {
        const canvas = document.getElementById('oscilloscope');
        const canvasCtx = canvas.getContext('2d');
        const bufferLength = AudioEngine.analyser.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);

        function draw() {
            requestAnimationFrame(draw);
            AudioEngine.analyser.getByteTimeDomainData(dataArray);

            canvasCtx.fillStyle = 'rgb(0, 0, 0)';
            canvasCtx.fillRect(0, 0, canvas.width, canvas.height);
            canvasCtx.lineWidth = 2;
            canvasCtx.strokeStyle = '#ff4081';
            canvasCtx.beginPath();

            const sliceWidth = canvas.width * 1.0 / bufferLength;
            let x = 0;

            for (let i = 0; i < bufferLength; i++) {
                const v = dataArray[i] / 128.0;
                const y = v * canvas.height / 2;
                if (i === 0) canvasCtx.moveTo(x, y);
                else canvasCtx.lineTo(x, y);
                x += sliceWidth;
            }
            canvasCtx.lineTo(canvas.width, canvas.height / 2);
            canvasCtx.stroke();
        }
        draw();
    }

    // 初期化
    ui.init();

</script>

</body>
</html>
